name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify lockfile and sync dependencies
        run: uv sync --locked --dev --python 3.14

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Compile source and tests
        run: uv run python -m compileall -q src tests
